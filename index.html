<!DOCTYPE html>
<html>
<head>
    <title>🔐 Painel de Keys</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            border: 2px solid #ff00ff;
        }
        h1 {
            color: #ff00ff;
            text-align: center;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #888;
        }
        input, select {
            width: 100%;
            padding: 15px;
            background: #333;
            border: 2px solid #444;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 18px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
        }
        .key-display {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px dashed #ff00ff;
            margin: 20px 0;
        }
        .key {
            color: #ff00ff;
            font-size: 24px;
            font-weight: bold;
            word-break: break-all;
        }
        .keys-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .key-item {
            background: #222;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 5px solid #ff00ff;
        }
        .key-value {
            color: #ff00ff;
            font-weight: bold;
            font-size: 18px;
        }
        .key-info {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        .status-ativo { color: #00ff00; }
        .status-usado { color: #ff0000; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <h1>🔐 PAINEL DE KEYS</h1>
        
        <div class="input-group">
            <label>👤 Cliente</label>
            <input type="text" id="cliente" placeholder="Nome do cliente">
        </div>
        
        <div class="input-group">
            <label>⏰ Validade (dias)</label>
            <select id="validade">
                <option value="1">1 dia</option>
                <option value="7">7 dias</option>
                <option value="15">15 dias</option>
                <option value="30">30 dias</option>
                <option value="60">60 dias</option>
                <option value="90">90 dias</option>
            </select>
        </div>
        
        <button onclick="gerarKey()">🎲 GERAR NOVA KEY</button>
        
        <div class="key-display" id="keyDisplay" style="display: none;">
            <h3>✅ KEY GERADA:</h3>
            <div class="key" id="generatedKey"></div>
            <button onclick="copiarKey()" style="margin-top: 15px;">📋 COPIAR</button>
        </div>
        
        <h3 style="margin: 20px 0 10px; color: #888;">📋 KEYS ATIVAS:</h3>
        <div class="keys-list" id="keysList"></div>
    </div>

    <script>
        // Config Firebase (COLOQUE SEUS DADOS AQUI!)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-projeto-id",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:android:abcdef"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function gerarKey() {
            // Gerar key (formato: XXXX-XXXX-XXXX-XXXX)
            let key = '';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            for (let i = 0; i < 16; i++) {
                if (i > 0 && i % 4 === 0) key += '-';
                key += chars[Math.floor(Math.random() * chars.length)];
            }
            
            const dias = parseInt(document.getElementById('validade').value);
            const agora = new Date();
            const expira = new Date();
            expira.setDate(agora.getDate() + dias);
            
            await db.collection('keys').add({
                key: key,
                ativa: true,
                criada_em: agora.toISOString(),
                expira_em: expira.toISOString(),
                cliente: document.getElementById('cliente').value || 'Anônimo',
                device_id: '',
                ativada_em: null
            });
            
            document.getElementById('generatedKey').textContent = key;
            document.getElementById('keyDisplay').style.display = 'block';
            carregarKeys();
        }

        function copiarKey() {
            const key = document.getElementById('generatedKey').textContent;
            navigator.clipboard.writeText(key);
            alert('Key copiada!');
        }

        async function carregarKeys() {
            const snapshot = await db.collection('keys')
                .orderBy('criada_em', 'desc')
                .get();
            
            let html = '';
            snapshot.forEach(doc => {
                const k = doc.data();
                const ativa = k.ativa && new Date(k.expira_em) > new Date();
                const status = ativa ? '🟢 ATIVA' : '🔴 INATIVA';
                const statusClass = ativa ? 'status-ativo' : 'status-usado';
                
                html += `
                    <div class="key-item">
                        <div class="key-value">${k.key}</div>
                        <div class="key-info">
                            👤 ${k.cliente}<br>
                            📅 Criada: ${new Date(k.criada_em).toLocaleDateString()}<br>
                            ⏰ Expira: ${new Date(k.expira_em).toLocaleDateString()}<br>
                            <span class="${statusClass}">${status}</span>
                            ${k.device_id ? '<br>📱 ' + k.device_id.substring(0,8) + '...' : ''}
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('keysList').innerHTML = html;
        }

        carregarKeys();
    </script>
</body>
</html>
